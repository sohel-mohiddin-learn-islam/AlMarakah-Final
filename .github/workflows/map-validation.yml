name: Map Validation

on:
  push:
    branches:
      - main
      - feature/realistic-character
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: map-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_SILENCE_ROOT_WARNING: 1
      LIBGL_ALWAYS_SOFTWARE: 1
      PULSE_SERVER: ""

    steps:
      - uses: actions/checkout@v4

      - name: Cache pinned Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/godot
            ~/.local/share/godot/export_templates/4.5.1.stable
          key: godot-linux-x86_64-4.5.1-android-web-v1

      - name: Install pinned Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: bash tools/install-godot.sh --templates

      - name: Add Godot to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Import Godot project
        run: godot --headless --audio-driver Dummy --editor --path . --import

      - name: Run regression tests
        run: bash tools/test.sh
