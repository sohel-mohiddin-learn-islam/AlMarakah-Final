name: AlMarakah Dedicated Server Check

on:
  workflow_dispatch:
  push:
    branches:
      - feature/realistic-character

permissions:
  contents: read

jobs:
  dedicated-server-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Godot 4.5.1
        run: bash tools/install-godot.sh
      - name: Import project
        run: godot --headless --editor --path . --import
      - name: Run dedicated-server diagnostic
        run: godot --headless --audio-driver Dummy --path . --script tools/check_dedicated_server.gd
      - name: Test raw ENet socket creation
        run: godot --headless --audio-driver Dummy --path . --script tools/test_enet_socket.gd
      - name: Test NetworkManager hosting
        run: godot --headless --audio-driver Dummy --path . --script tools/check_server_manager.gd
      - name: Validate dedicated-server entry point
        run: godot --headless --audio-driver Dummy --path . --script tools/check_dedicated_entry.gd
      - name: Test dedicated-server startup
        shell: bash
        run: |
          set +e
          timeout 15s godot --headless --audio-driver Dummy --path . --script scripts/dedicated_server.gd > /tmp/almarakah-server.log 2>&1
          status=$?
          cat /tmp/almarakah-server.log

          if ! grep -q "SERVER STATUS: READY" /tmp/almarakah-server.log; then
            echo "ERROR: Dedicated server did not report READY."
            exit 1
          fi

          if [ "$status" -ne 124 ] && [ "$status" -ne 0 ]; then
            echo "ERROR: Server exited unexpectedly with status $status."
            exit "$status"
          fi

          echo "DEDICATED SERVER STARTUP TEST: PASSED"
      - name: Test ENet client connection and disconnection
        run: godot --headless --audio-driver Dummy --path . --script tools/test_dedicated_server.gd
      - name: Test real Player movement RPC between separate processes
        shell: bash
        run: |
          set -euo pipefail
          host_log=/tmp/almarakah-movement-host.log
          client_log=/tmp/almarakah-movement-client.log

          godot --headless --audio-driver Dummy --path . --script tests/network/movement_host.gd > "$host_log" 2>&1 &
          host_pid=$!

          cleanup() {
            kill "$host_pid" 2>/dev/null || true
            wait "$host_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..100}; do
            if grep -q "MOVEMENT TEST HOST READY ON PORT: 17878" "$host_log"; then
              ready=1
              break
            fi
            if ! kill -0 "$host_pid" 2>/dev/null; then
              cat "$host_log"
              echo "ERROR: Movement test host exited before readiness."
              exit 1
            fi
            sleep 0.1
          done

          if [ "$ready" -ne 1 ]; then
            cat "$host_log"
            echo "ERROR: Movement test host did not become ready."
            exit 1
          fi

          set +e
          godot --headless --audio-driver Dummy --path . --script tests/network/movement_client.gd > "$client_log" 2>&1
          client_status=$?
          set -e
          cat "$client_log"

          if [ "$client_status" -ne 0 ]; then
            cat "$host_log"
            echo "ERROR: Movement test client failed with status $client_status."
            exit "$client_status"
          fi

          set +e
          wait "$host_pid"
          host_status=$?
          set -e
          cat "$host_log"

          if [ "$host_status" -ne 0 ]; then
            echo "ERROR: Movement test host failed with status $host_status."
            exit "$host_status"
          fi

          grep -q "REAL PLAYER MOVEMENT HANDLER: PASSED" "$host_log"
          grep -q "CLIENT RECEIVED HOST MOVEMENT ACK: OK" "$client_log"
          echo "REAL PLAYER MOVEMENT RPC TEST: PASSED"
