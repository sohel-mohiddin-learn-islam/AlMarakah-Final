name: Test and build Almarakah

on:
  push:
    branches:
      - main
      - feature/realistic-character
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: almarakah-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      GODOT_SILENCE_ROOT_WARNING: 1
      LIBGL_ALWAYS_SOFTWARE: 1
      PULSE_SERVER: ""

    steps:
      - uses: actions/checkout@v4

      - name: Cache pinned Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/godot
            ~/.local/share/godot/export_templates/4.5.1.stable
          key: godot-linux-x86_64-4.5.1-android-web-v1

      - name: Install pinned Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != true
        run: bash tools/install-godot.sh --templates

      - name: Add Godot to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: ISOLATED CHARACTER ANIMATOR SOURCE PARSE
        run: |
          mkdir -p /tmp/animator-parse/scripts
          mkdir -p /tmp/animator-parse/assets/animations/quaternius
          cp scripts/character_animator.gd /tmp/animator-parse/scripts/character_animator.gd
          cp assets/animations/quaternius/AnimationLibrary_Godot_Standard.gltf /tmp/animator-parse/assets/animations/quaternius/AnimationLibrary_Godot_Standard.gltf
          cp assets/animations/quaternius/AnimationLibrary_Godot_Standard.bin /tmp/animator-parse/assets/animations/quaternius/AnimationLibrary_Godot_Standard.bin
          printf '%s\n' '[application]' 'config/name="AnimatorParse"' '[rendering]' 'renderer/rendering_method="gl_compatibility"' > /tmp/animator-parse/project.godot
          cp tools/check_character_animator_source.gd /tmp/animator-parse/check.gd
          godot --headless --audio-driver Dummy --path /tmp/animator-parse --script /tmp/animator-parse/check.gd

      - name: Import project and run every regression suite
        run: bash tools/test.sh

      - name: Inspect imported Quaternius character
        run: |
          godot \
            --headless \
            --audio-driver Dummy \
            --path . \
            --script tools/inspect_character.gd

      - name: Inspect Godot retarget API
        run: |
          godot --headless --audio-driver Dummy --path . --script tools/inspect_retarget_api.gd

      - name: Inspect RetargetModifier3D properties
        run: |
          godot --headless --audio-driver Dummy --path . --script tools/inspect_retarget_modifier_properties.gd

      - name: Inspect Skeleton3D retarget API
        run: |
          godot --headless --audio-driver Dummy --path . --script tools/inspect_skeleton_retarget_api.gd

      - name: Inspect detailed humanoid retarget API
        run: |
          godot --headless --audio-driver Dummy --path . --script tools/inspect_humanoid_profile.gd

      - name: Inspect Godot humanoid profile bones
        run: |
          godot --headless --audio-driver Dummy --path . --script tools/inspect_humanoid_bones.gd

      - name: Test Godot humanoid BoneMap mapping
        run: |
          godot --headless --audio-driver Dummy --path . --script tools/test_bonemap.gd

      - name: Test Quaternius character retarget skeletons
        run: |
          godot --headless --audio-driver Dummy --path . --script tools/test_character_retarget.gd

      - name: Test retarget hierarchy mapping
        run: |
          godot --headless --audio-driver Dummy --path . --script tools/test_retarget_hierarchy.gd

      - name: TEST REAL WALK ANIMATION TRANSFER
        run: |
          echo "=== RUNNING REAL WALK ANIMATION TRANSFER TEST ==="
          godot --headless --audio-driver Dummy --path . --script tools/test_manual_animation_retarget.gd

      - name: DIAGNOSE CHARACTER ANIMATOR PARSER
        run: |
          godot --headless --audio-driver Dummy --path . --script tools/check_character_animator.gd
      - name: Test real Quaternius character animation
        run: |
          godot --headless --audio-driver Dummy --path . --script tools/test_real_character_animation.gd
